<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deleted History — Data Tracker</title>
    <meta name="description" content="View and restore all deleted pipe entries." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Inter:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        :root {
            --paper: #fbf6e9;
            --paper-edge: #efe6cf;
            --ink: #1a3a8a;
            --ink-soft: #3858b3;
            --rule: #d9c98a;
            --danger: #b3261e;
            --restore: #1a7a3a;
        }

        body {
            font-family: 'Patrick Hand', 'Caveat', cursive, sans-serif;
            background:
                radial-gradient(1200px 600px at 20% -10%, #fff8e0 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 110%, #f3e8c2 0%, transparent 60%),
                #f0e6cb;
            color: var(--ink);
            min-height: 100vh;
            padding: 28px 16px 60px;
        }

        /* ===== HEADER ===== */
        .hist-header {
            max-width: 1100px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .hist-title {
            font-family: 'Caveat', cursive;
            font-size: 38px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hist-title .icon {
            font-size: 34px;
        }

        .hist-subtitle {
            font-family: 'Patrick Hand', cursive;
            font-size: 16px;
            color: #6b5d2a;
            margin-top: 2px;
        }

        .hist-back-btn {
            font-family: 'Patrick Hand', cursive;
            font-size: 17px;
            color: var(--ink);
            background: #fff;
            border: 1.5px solid var(--ink);
            border-radius: 999px;
            padding: 9px 20px;
            cursor: pointer;
            transition: background .18s, color .18s, transform .15s;
            text-decoration: none;
            display: inline-block;
        }

        .hist-back-btn:hover {
            background: var(--ink);
            color: #fff;
            transform: translateY(-2px);
        }

        /* ===== TOOLBAR ===== */
        .hist-toolbar {
            max-width: 1100px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--rule);
            border-radius: 14px;
            backdrop-filter: blur(6px);
        }

        .count-badge-main {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            background: rgba(26, 58, 138, 0.1);
            color: var(--ink);
            padding: 4px 12px;
            border-radius: 20px;
            margin-left: auto;
        }

        .btn-h {
            font-family: 'Patrick Hand', cursive;
            font-size: 16px;
            border-radius: 999px;
            padding: 8px 18px;
            cursor: pointer;
            border: 1.5px solid currentColor;
            transition: background .18s, color .18s, transform .15s, box-shadow .18s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-h:hover {
            transform: translateY(-2px);
        }

        .btn-h:active {
            transform: translateY(0);
        }

        .btn-h.clear-all {
            color: var(--danger);
            background: #fff;
        }

        .btn-h.clear-all:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 8px 18px -10px rgba(179, 38, 30, 0.6);
        }

        /* ===== PAGE CARD ===== */
        .hist-page {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--paper);
            border: 1px solid var(--paper-edge);
            border-radius: 18px;
            box-shadow:
                0 1px 0 #fff inset,
                0 30px 60px -30px rgba(40, 30, 10, 0.25),
                0 8px 18px -10px rgba(40, 30, 10, 0.18);
            padding: 30px 28px;
            position: relative;
            overflow: hidden;
        }

        /* Notebook line background */
        .hist-page::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: linear-gradient(to bottom, transparent 0, transparent 41px, var(--rule) 41px, var(--rule) 42px, transparent 42px);
            background-size: 100% 42px;
            background-position: 0 18px;
            pointer-events: none;
            opacity: 0.35;
            z-index: 0;
        }

        /* ===== EMPTY STATE ===== */
        .hist-empty {
            text-align: center;
            padding: 60px 20px;
            font-family: 'Caveat', cursive;
            font-size: 28px;
            color: #9a8a55;
            position: relative;
            z-index: 1;
        }

        .hist-empty span {
            display: block;
            font-size: 52px;
            margin-bottom: 10px;
        }

        /* ===== TABLE ===== */
        .hist-table-wrap {
            position: relative;
            z-index: 1;
            overflow-x: auto;
        }

        table.hist-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Patrick Hand', cursive;
            font-size: 19px;
        }

        table.hist-table thead tr {
            border-bottom: 2px solid #c9b97b;
        }

        table.hist-table thead th {
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #a0935a;
            padding: 10px 14px;
            text-align: left;
            white-space: nowrap;
        }

        table.hist-table thead th.th-center {
            text-align: center;
        }

        table.hist-table tbody tr {
            border-bottom: 1px solid rgba(201, 185, 123, 0.35);
            transition: background .18s;
        }

        table.hist-table tbody tr:hover {
            background: rgba(255, 253, 244, 0.9);
        }

        table.hist-table tbody td {
            padding: 10px 14px;
            vertical-align: middle;
        }

        .td-num {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #aaa;
            width: 36px;
            text-align: center;
        }

        .td-value {
            font-size: 20px;
            font-weight: 500;
            color: var(--ink);
            min-width: 150px;
        }

        .td-col {
            font-size: 15px;
            color: #6b5d2a;
        }

        .td-date {
            font-size: 15px;
            color: #888;
            white-space: nowrap;
            min-width: 200px;
            vertical-align: top;
            padding-top: 12px;
        }

        .td-deleted {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            color: #999;
            white-space: nowrap;
        }

        .td-actions {
            text-align: center;
            white-space: nowrap;
        }

        /* ===== ACTION BUTTONS ===== */
        .act-btn {
            font-family: 'Patrick Hand', cursive;
            font-size: 14px;
            border-radius: 20px;
            padding: 4px 13px;
            cursor: pointer;
            border: 1.5px solid currentColor;
            transition: background .15s, color .15s, transform .12s, box-shadow .15s;
            margin: 0 3px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .act-btn:hover {
            transform: translateY(-1px);
        }

        .act-btn:active {
            transform: translateY(0);
        }

        .act-btn.restore {
            color: var(--restore);
            background: #f0fff4;
            border-color: var(--restore);
        }

        .act-btn.restore:hover {
            background: var(--restore);
            color: #fff;
            box-shadow: 0 4px 10px rgba(26, 122, 58, 0.3);
        }

        .act-btn.del {
            color: var(--danger);
            background: #fff5f5;
            border-color: var(--danger);
        }

        .act-btn.del:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 4px 10px rgba(179, 38, 30, 0.3);
        }

        /* ===== TOAST ===== */
        #hist-toast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1a3a8a;
            color: #fff;
            font-family: 'Patrick Hand', cursive;
            font-size: 18px;
            padding: 12px 28px;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(26, 58, 138, 0.35);
            opacity: 0;
            transition: transform .3s ease, opacity .3s ease;
            pointer-events: none;
            z-index: 999;
            white-space: nowrap;
        }

        #hist-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="hist-header">
        <div>
            <div class="hist-title">
                Deleted History
            </div>
        </div>
        <a class="hist-back-btn" href="index.html">← Back to Tracker</a>
    </div>

    <!-- TOOLBAR -->
    <div class="hist-toolbar">
        <button class="btn-h clear-all" id="clear-all-btn">🗑 Clear All History</button>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
            <input type="text" id="hist-search-input" placeholder="" autocomplete="off"
                style="padding: 6px 14px; border-radius: 20px; border: 1.5px solid #d9c98a; font-family: 'Inter', sans-serif; font-size: 14px; width: 240px; outline: none; color: #1a3a8a;" />
            <span class="count-badge-main" id="hist-count" style="margin-left: 0;">0 entries</span>
        </div>
    </div>

    <!-- PAGE CARD -->
    <div class="hist-page">
        <div class="hist-table-wrap" id="hist-table-wrap">
            <div class="hist-empty">
                <span>📭</span>
                No deleted items yet.<br>Delete something from the tracker to see it here.
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="hist-toast"></div>

    <script src="api-client.js"></script>
    <script src="history.js"></script>
</body>

</html>
